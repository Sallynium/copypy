<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲端剪貼簿</title>
<style>
  body { font-family: -apple-system, "Microsoft JhengHei", Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 12px; }
  textarea { width: 100%; height: 300px; font-size: 16px; padding: 8px; box-sizing: border-box; }
  input[type=text] { width: 100%; font-size: 14px; padding: 6px; box-sizing: border-box; }
  button { font-size: 14px; padding: 6px 12px; margin: 4px 4px 4px 0; cursor: pointer; }
  #status { color: #666; font-size: 13px; margin: 6px 0; }
  .row { margin: 10px 0; }
  .warn { color: #b00; font-size: 13px; }
</style>
</head>
<body>
<h2>雲端剪貼簿（跨主機文字傳遞）</h2>

<div class="row">
  <label>這台裝置的網址（第一次要在另一台輸入相同網址，之後直接開這個連結即可）：</label>
  <input type="text" id="shareUrl" readonly onclick="this.select()">
</div>

<textarea id="clip" placeholder="在這裡貼上或輸入文字，會自動同步…"></textarea>

<div class="row">
  <button onclick="saveNow()">立即儲存</button>
  <button onclick="loadNow()">立即讀取</button>
  <button onclick="copyText()">複製文字</button>
  <button onclick="newRoom()">開新房間</button>
</div>

<div id="status">初始化中…</div>
<div id="err" class="warn"></div>

<script>
const KVDB = "https://kvdb.io";
const ta = document.getElementById('clip');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
const shareUrlEl = document.getElementById('shareUrl');

let bucket = null;
let lastSavedValue = "";
let saveTimer = null;
let editing = false;

function setStatus(msg) { statusEl.textContent = msg; }
function setErr(msg) { errEl.textContent = msg || ""; }

function updateShareUrl() {
  const url = location.origin + location.pathname + "#b=" + bucket;
  shareUrlEl.value = url;
  history.replaceState(null, "", "#b=" + bucket);
}

async function createBucket() {
  const res = await fetch(KVDB + "/", { method: "POST" });
  if (!res.ok) throw new Error("建立房間失敗 (" + res.status + ")");
  return (await res.text()).trim();
}

async function initBucket() {
  const hashMatch = location.hash.match(/b=([A-Za-z0-9_-]+)/);
  if (hashMatch) {
    bucket = hashMatch[1];
    localStorage.setItem('kvdb_bucket', bucket);
  } else {
    bucket = localStorage.getItem('kvdb_bucket');
  }
  if (!bucket) {
    setStatus("建立新房間中…");
    bucket = await createBucket();
    localStorage.setItem('kvdb_bucket', bucket);
  }
  updateShareUrl();
}

async function saveNow() {
  clearTimeout(saveTimer);
  const value = ta.value;
  if (value === lastSavedValue) return;
  try {
    setErr("");
    const res = await fetch(`${KVDB}/${bucket}/clip`, { method: "PUT", body: value });
    if (!res.ok) throw new Error("儲存失敗 (" + res.status + ")");
    lastSavedValue = value;
    setStatus("已儲存 " + new Date().toLocaleTimeString());
  } catch (e) {
    setErr("儲存錯誤：" + e.message);
  }
}

async function loadNow() {
  try {
    setErr("");
    const res = await fetch(`${KVDB}/${bucket}/clip`);
    if (res.status === 404) {
      setStatus("房間是空的（尚未有內容）");
      return;
    }
    if (!res.ok) throw new Error("讀取失敗 (" + res.status + ")");
    const value = await res.text();
    if (!editing && value !== ta.value) {
      ta.value = value;
      lastSavedValue = value;
    }
    setStatus("已讀取 " + new Date().toLocaleTimeString());
  } catch (e) {
    setErr("讀取錯誤：" + e.message);
  }
}

async function copyText() {
  try {
    await navigator.clipboard.writeText(ta.value);
    setStatus("已複製到本機剪貼簿");
  } catch (e) {
    ta.select();
    document.execCommand('copy');
    setStatus("已嘗試複製（若失敗請手動選取後 Ctrl+C）");
  }
}

function newRoom() {
  if (!confirm("確定要開新房間嗎？目前的分享連結將失效，需要在另一台裝置重新輸入新網址。")) return;
  localStorage.removeItem('kvdb_bucket');
  location.hash = "";
  location.reload();
}

ta.addEventListener('focus', () => editing = true);
ta.addEventListener('blur', () => editing = false);
ta.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 600);
});

(async function main() {
  try {
    await initBucket();
    await loadNow();
    setInterval(loadNow, 3000);
  } catch (e) {
    setErr("初始化錯誤：" + e.message);
    setStatus("失敗");
  }
})();
</script>
</body>
</html>
